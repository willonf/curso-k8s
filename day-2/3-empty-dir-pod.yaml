apiVersion: v1
kind: Pod
metadata:
  labels:
    run: polaris
    app: webserver
  name: polaris
spec:
  containers:
  - image: nginx
    name: webserver
    volumeMounts:
    - mountPath: /polaris
      name: primeiro-emptydir
    resources:
      limits:
        cpu: "1"
        memory: "128Mi"
      requests:
        cpu: "0.5"
        memory: "64Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  volumes:  # Definição dos volumes
  - name: primeiro-emptydir
    emptyDir:
      sizeLimit: 256Mi