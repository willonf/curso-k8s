# Config do control-plane usada no `kubeadm init --config`.
# Escolha uma das variantes conforme o CNI que pretende usar:
#   - kubeadm-config-flannel.yaml (podSubnet 10.244.0.0/16 - Flannel)
#   - kubeadm-config-weave.yaml   (podSubnet 10.244.0.0/16 - Weave)
# - cgroupDriver: systemd (combina com o containerd configurado no provision-node.sh)
# - podSubnet: 10.244.0.0/16 (compativel com Flannel e Weave).
#   Se for usar Calico, troque para 192.168.0.0/16.
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
networking:
  podSubnet: 10.244.0.0/16
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd